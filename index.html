<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12352b">
  <meta name="description" content="Sistema de gestão de frota Frota PRO">
  <title>Frota PRO | Gestão de Frota</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="logo.png" alt="Frota PRO" class="brand-logo">
      <p>Sistema de gestão de frota</p>
    </div>
  </header>

  <main class="container">
    <div class="main-grid">
      <section class="card login-card">
        <h2>Acessar o sistema</h2>
        <p>Entre com seu e-mail e sua senha cadastrados.</p>

        <form id="login-form">
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="seu@email.com"
            required
          >

          <label for="password">Senha</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Digite sua senha"
            required
          >

          <button class="button button-primary" type="submit">
            Entrar
          </button>

          <p id="login-message" class="message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>

</body>
</html>
