<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frota PRO | Painel</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-painel">
<header class="painel-topo">
  <div class="painel-marca">
    <img src="logo.png" alt="Logo Frota PRO" class="painel-logo">
    <p id="nome-usuario">Usuário</p>
  </div>

  <div class="painel-acoes">
    <button
      id="botao-ajustes"
      class="botao-ajustes"
      type="button"
      aria-label="Ajustes"
      title="Ajustes"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"></path>
        <path d="m19.4 15 .1.1 1.4 1.1-1.5 2.6-1.7-.7a8 8 0 0 1-1.8 1l-.3 1.9h-3l-.3-1.9a8 8 0 0 1-1.8-1l-1.7.7-1.5-2.6 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.5-2.6 1.7.7a8 8 0 0 1 1.8-1l.3-1.9h3l.3 1.9a8 8 0 0 1 1.8 1l1.7-.7 1.5 2.6-1.4 1.1a7 7 0 0 1 0 2Z"></path>
      </svg>
    </button>

    <button id="botao-sair" type="button">Sair</button>
  </div>
</header>

<div id="painel-ajustes" class="painel-ajustes" hidden>
  <h3>Ajustes</h3>

  <label for="tema-aplicativo">Tema</label>
  <select id="tema-aplicativo">
    <option value="claro">Claro</option>
    <option value="verde">Verde</option>
    <option value="azul">Azul</option>
    <option value="escuro">Escuro</option>
  </select>

  <label for="tamanho-fonte">Tamanho da fonte</label>
  <input id="tamanho-fonte" type="range" min="12" max="22" value="16" step="1">
  <span id="valor-fonte">16 px</span>
</div>

  <main class="painel-conteudo">
    <section class="boas-vindas" id="boas-vindas">
      <h2 id="mensagem-boas-vindas">Bem-vindo ao Frota PRO</h2>
      <p>Selecione uma opção no menu inferior para começar.</p>
    </section>

    <section class="area-modulo" aria-live="polite">
      <h3 id="titulo-modulo">Início</h3>
      <div id="conteudo-modulo">
        <p>Bem-vindo ao painel de gestão da frota.</p>
      </div>
    </section>
  </main>

  <nav class="menu-inferior" aria-label="Menu principal">

    <button class="item-menu ativo" data-modulo="inicio" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/>
      </svg>
      <span>Início</span>
    </button>

    <button class="item-menu" data-modulo="abastecimentos" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 21V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v17M3 21h14M7 6h6v5H7zM16 8h2l3 3v6a2 2 0 0 1-4 0v-4"/>
      </svg>
      <span>Abastecimentos</span>
    </button>

    <button class="item-menu" data-modulo="motoristas" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="9" cy="10" r="2.5"/>
        <path d="M5.5 16c.7-2 2-3 3.5-3s2.8 1 3.5 3M15 9h3M15 12h3M15 15h2"/>
      </svg>
      <span>Motoristas</span>
    </button>

    <button class="item-menu" data-modulo="mecanica" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14.5 6.5a5 5 0 0 0-6.6 6.6L3 18a2.1 2.1 0 0 0 3 3l4.9-4.9a5 5 0 0 0 6.6-6.6l-3.2 3.2-3-3z"/>
      </svg>
      <span>Mecânica</span>
    </button>

    <button class="item-menu" data-modulo="revisao" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3c-2.5 4-7 8.1-7 12a7 7 0 0 0 14 0c0-3.9-4.5-8-7-12zM9 16a3 3 0 0 0 3 3"/>
      </svg>
      <span>Revisão</span>
    </button>

    <button class="item-menu" data-modulo="pecas" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 4h5a3 3 0 0 0 6 0h5v5a3 3 0 0 1 0 6v5h-5a3 3 0 0 0-6 0H4v-5a3 3 0 0 1 0-6z"/>
      </svg>
      <span>Peças</span>
    </button>

    <button class="item-menu" data-modulo="relatorios" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
      </svg>
      <span>Relatórios</span>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
